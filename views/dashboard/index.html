<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f6" />
  <title>中国邮政储蓄银行 · 经营台</title>
  <link rel="stylesheet" href="./terminal-base.css?v=5" />
  <link rel="stylesheet" href="./tweak.css?v=5" />
  <style>
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
               padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .list li:last-child { border-bottom: 0; }
    .list .p { font-variant-numeric: tabular-nums; }
    .list .s { color: var(--muted); font-size: 10.5px; }
    .pick { display: flex; width: 100%; text-align: left; gap: 10px; align-items: baseline;
            justify-content: space-between; padding: 8px 0; border: 0;
            border-bottom: 1px solid var(--line); background: transparent; color: var(--text);
            font: inherit; font-size: 12px; cursor: pointer; border-radius: 0; }
    .pick:last-child { border-bottom: 0; }
    .pick:hover { color: var(--pink); }
    .pick .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick .v { color: var(--muted); font-size: 10.5px; white-space: nowrap; flex: 0 0 auto; }
    .pick .g { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px;
               background: var(--hover); color: var(--muted); font-size: 10px; flex: 0 0 auto; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .form label { display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; color: var(--muted); }
    .form input, .form select { font: inherit; font-size: 12px; padding: 7px 9px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span> 中国邮政储蓄银行</div>
    <div class="clock" id="clock">--</div>
  </header>
  <nav class="tabs" id="flow"></nav>
  <div class="sub" id="tip" style="color:var(--pink2)"></div>
  <div id="stage"></div>
</div>

<script>
(function () {
  var bridge = null, DATA = null;
  var nav = [{ s: "home", c: {}, t: "总览" }], cur = 0;

  function resolve() {
    if (bridge) return bridge;
    var c = [];
    try { c.push(window.AstrBotPluginView, window.AstrBotPluginPage); } catch (e) {}
    try { c.push(window.parent.AstrBotPluginView, window.parent.AstrBotPluginPage); } catch (e) {}
    bridge = c.find(function (b) { return b && typeof b.apiGet === "function"; }) || null;
    return bridge;
  }
  function wait(fn, n) {
    n = (n == null) ? 60 : n;
    if (resolve()) { fn(); return; }
    if (n > 0) setTimeout(function () { wait(fn, n - 1); }, 120);
  }
  function unwrap(r) { var v = r; if (v && typeof v === "object" && "data" in v) v = v.data; return v; }
  async function get(p) { var b = resolve(); try { return b ? unwrap(await b.apiGet(p)) : null; } catch (e) { return null; } }
  async function act(params) {
    var b = resolve();
    if (b && typeof b.apiPost === "function") {
      try { var v = unwrap(await b.apiPost("bank", params)) || {}; if (v && (v.ok !== undefined || v.verdict)) return v; } catch (e) {}
    }
    var qs = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
    return await get("bank?" + qs);
  }
  function el(id) { return document.getElementById(id); }
  function h(tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
  function clear(x) { while (x.firstChild) x.removeChild(x.firstChild); }
  function money(n) { var v = Number(n || 0); return (Math.abs(v) >= 10000) ? (v / 10000).toFixed(2) + "亿" : (Math.round(v * 10) / 10); }
  function yuan(n) { var v = Number(n || 0); return "¥" + (Math.round(v * 100) / 100).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function I(id) { var s = (DATA && DATA.items || {})[id]; return s || []; }

  function paint() {
    var f = el("flow"); clear(f);
    nav.slice(0, cur + 1).forEach(function (n, i) {
      var b = h("button", "tab" + (i === cur ? " on" : ""), n.t || "—");
      b.type = "button";
      b.addEventListener("click", function () { if (i < cur) { cur = i; render(); } });
      f.appendChild(b);
    });
  }
  function push(s, c, t) { nav = nav.slice(0, cur + 1); nav.push({ s: s, c: c || {}, t: t || "" }); cur = nav.length - 1; }
  function back() { if (cur > 0) { cur -= 1; render(); } }
  function card(title, right) {
    var sec = h("section", "card");
    var row = h("div", "row between");
    row.appendChild(h("div", "label", title));
    if (right) row.appendChild(h("div", "sub", right));
    sec.appendChild(row);
    return sec;
  }
  function pick(title, sub, o) {
    o = o || {};
    var b = h("button", "pick");
    b.type = "button"; b.title = title || "";
    if (o.icon) b.appendChild(h("span", "g", o.icon));
    if (!o.icon) b.appendChild(h("span", "t", title || ""));
    b.appendChild(h("span", "v", sub || ""));
    b.addEventListener("click", o.onClick || function () {});
    return b;
  }
  function kv(sec, label, value) {
    var r = h("div", "row between");
    r.appendChild(h("div", "sub", label));
    r.appendChild(h("div", "value", value));
    sec.appendChild(r);
  }
  function stat(sec, label, value, sub) {
    var grid = sec.querySelector(".status-grid");
    if (!grid) { grid = h("div", "status-grid"); sec.appendChild(grid); }
    var it = h("div", "status-item");
    it.appendChild(h("div", "label", label));
    it.appendChild(h("div", "value", value));
    if (sub) it.appendChild(h("div", "sub", sub));
    grid.appendChild(it);
  }
  function foot(sec, note, actions) {
    var r = h("div", "row between"); r.style.marginTop = "12px";
    r.appendChild(h("div", "sub", note || ""));
    var box = h("div");
    (actions || []).forEach(function (a) {
      var b = h("button", "tab", a.text); b.type = "button";
      b.addEventListener("click", a.onClick || function () {}); box.appendChild(b);
    });
    r.appendChild(box); sec.appendChild(r);
  }

  var V = {};

  V.home = function (wrap) {
    var g = I("group") || [];
    var c = card("经营总览", "中国邮政储蓄银行");
    (DATA && DATA.bank && DATA.bank.note) && c.appendChild(h("div", "sub", DATA.bank.note));
    g.slice(0, 4).forEach(function (x) { stat(c, x.name, money(x.price) + (x.unit === "%" ? "%" : x.unit ? " " + x.unit : ""), x.note); });
    wrap.appendChild(c);

    var c2 = card("对公与企业信贷");
    c2.appendChild(pick("企业信贷", "试算一笔：额度、期限、利率", { icon: "贷", onClick: function () { push("credit", {}, "信贷"); render(); } }));
    c2.appendChild(pick("对公产品", (I("corporate") || []).length + " 个", { icon: "公", onClick: function () { push("corp", {}, "对公"); render(); } }));
    wrap.appendChild(c2);

    var c4 = card("她的钱与业务");
    c4.appendChild(pick("个人", "资产：存款、理财、车房", { icon: "己",
      onClick: function () { push("me", {}, "个人"); render(); } }));
    c4.appendChild(pick("股票", "持仓与买卖（银行业务）", { icon: "股",
      onClick: function () { push("stocks", {}, "股票"); render(); } }));
    wrap.appendChild(c4);

    var c3 = card("总行");
    c3.appendChild(pick("部门", (I("departments") || []).length + " 个", { icon: "部", onClick: function () { push("depts", {}, "部门"); render(); } }));
    c3.appendChild(pick("利率表", (I("rates") || []).length + " 项", { icon: "率", onClick: function () { push("rates", {}, "利率"); render(); } }));
    c3.appendChild(pick("风控", "口径与红线", { icon: "控", onClick: function () { push("risk", {}, "风控"); render(); } }));
    c3.appendChild(pick("对私产品", (I("retail") || []).length + " 个", { icon: "私", onClick: function () { push("retail", {}, "对私"); render(); } }));
    wrap.appendChild(c3);
  };

  V.depts = function (wrap) {
    var c = card("总行架构", (I("departments") || []).length + " 个部门");
    (I("departments") || []).forEach(function (d) {
      c.appendChild(pick(d.name, d.head + " · " + d.price + " 人", {
        onClick: function () { push("dept", { d: d }, d.name); render(); } }));
    });
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };

  V.dept = function (wrap, ctx) {
    var d = ctx.d || {};
    var c = card(d.name, d.price + " 人");
    c.appendChild(h("div", "sub", "负责人：" + d.head));
    kv(c, "职责", d.duty);
    kv(c, "KPI", d.kpi);
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };

  V.corp = function (wrap) { listProducts(wrap, "corporate", "对公产品"); };
  V.retail = function (wrap) { listProducts(wrap, "retail", "对私产品"); };

  function listProducts(wrap, kind, title) {
    var c = card(title, (I(kind) || []).length + " 个");
    (I(kind) || []).forEach(function (p) {
      var r = h("div", "row between");
      var l = h("div");
      l.appendChild(h("div", "sub", p.name));
      l.appendChild(h("div", "sub", String(p.note || "").split("｜")[0]));
      r.appendChild(l);
      r.appendChild(h("div", "sub", String(p.note || "").split("｜")[1] || ""));
      c.appendChild(r);
    });
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  }

  V.rates = function (wrap) {
    var c = card("利率表", "年化");
    (I("rates") || []).forEach(function (r) { kv(c, r.name, Number(r.price).toFixed(2) + "%"); });
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };

  V.risk = function (wrap) {
    var c = card("风控口径");
    (I("risk") || []).forEach(function (r) { kv(c, r.name, r.note); });
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };

  V.credit = function (wrap) {
    var c = card("企业信贷试算", "对公");
    c.appendChild(h("div", "sub", "填金额、期限，选产品，按集团负债率与抵押覆盖算。"));
    var f = h("div", "form");
    function field(label, id, val, type) {
      var l = h("label", null, label);
      var i = document.createElement("input");
      i.id = id; i.type = type || "text"; i.value = val == null ? "" : val;
      l.appendChild(i); f.appendChild(l); return i;
    }
    field("金额（万元）", "inAmount", "3000", "number");
    field("期限（月）", "inMonths", "36", "number");
    field("负债率（%）", "inDebt", "58", "number");
    field("抵押覆盖（倍）", "inCover", "1.4", "number");
    var sel = document.createElement("select");
    sel.id = "inKind";
    ["流动资金贷款", "固定资产贷款", "科创信用贷", "供应链融资", "银行承兑汇票", "履约保函", "并购贷款"].forEach(function (k) {
      var o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o);
    });
    var l2 = h("label", null, "产品"); l2.appendChild(sel);
    l2.style.gridColumn = "1 / -1"; f.appendChild(l2);
    c.appendChild(f);
    var out = h("div"); out.id = "creditOut"; c.appendChild(out);
    c.appendChild(pick("试算", "按当前口径判", {
      icon: "算", onClick: async function () {
        var res = await act({
          action: "credit",
          amount: el("inAmount").value, months: el("inMonths").value,
          debt: el("inDebt").value, collateral: el("inCover").value,
          kind: el("inKind").value,
        });
        clear(out);
        if (!res) { out.appendChild(h("div", "sub", "算不出来")); return; }
        out.appendChild(h("div", "sub", res.verdict + "：" + (res.product || "")));
        kv(out, "月供", (res.plan && res.plan.monthly) + " 万");
        kv(out, "总利息", (res.plan && res.plan.interest) + " 万");
        (res.reasons || []).forEach(function (r) { out.appendChild(h("div", "sub", "· " + r)); });
      } }));
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };


  V.me = function (wrap) {
    var rows = I("private");
    var c = card("她的私人资产", rows.length ? "" : "账本没读到");
    rows.forEach(function (x) {
      var val = (x.unit === "元") ? yuan(x.price) : (x.note || "");
      kv(c, x.name, val);
      if (x.unit === "元" && x.note) c.appendChild(h("div", "sub", "　" + x.note));
    });
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };

  V.stocks = function (wrap) {
    var rows = I("stocks");
    var c = card("股票", rows.length + " 只");
    if (!rows.length) c.appendChild(h("div", "sub", "还没持仓。"));
    rows.forEach(function (x) {
      if (x.summary) {
        var pct = (x.pnl_pct == null) ? "" : ("（" + Number(x.pnl_pct).toFixed(2) + "%）");
        var sign = Number(x.pnl || 0) >= 0 ? "+" : "";
        var txt = (x.name === "总市值") ? yuan(x.value || 0)
          : (x.name === "总权益") ? yuan(x.value || 0)
          : (sign + yuan(x.pnl || 0) + pct);
        c.appendChild(pick(x.name, txt, { onClick: function () {} }));
        return;
      }
      var p2 = (x.pnl == null) ? "" : (" · " + (Number(x.pnl) >= 0 ? "+" : "") + yuan(x.pnl) +
        (x.pnl_pct == null ? "" : "（" + Number(x.pnl_pct).toFixed(1) + "%）"));
      c.appendChild(pick(x.name, (x.shares || 0) + " 股" + p2, {
        onClick: function () { push("stock", { x: x }, x.name); render(); } }));
    });
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };

  V.stock = function (wrap, ctx) {
    var x = ctx.x || {};
    var c = card(x.name, x.code || "");
    kv(c, "现价", yuan(x.price));
    kv(c, "持仓", (x.shares || 0) + " 股");
    kv(c, "市值", yuan(x.value || 0));
    kv(c, "浮动盈亏", yuan(x.pnl || 0));
    c.appendChild(pick("买 100 股", yuan(100 * (x.price || 0)), {
      icon: "买", onClick: async function () {
        await act({ action: "buy", code: x.code, shares: 100 }); await reload(); back();
      } }));
    c.appendChild(pick("卖 100 股", "按现价", {
      icon: "卖", onClick: async function () {
        await act({ action: "sell", code: x.code, shares: 100 }); await reload(); back();
      } }));
    foot(c, "", [{ text: "返回", onClick: back }]);
    wrap.appendChild(c);
  };

  function render() {
    paint();
    var box = el("stage"); clear(box);
    var n = nav[cur];
    (V[n.s] || V.home)(box, n.c || {});
  }
  async function reload() { DATA = await get("bank"); }
  function clock() {
    var t = el("clock"); if (!t) return; var d = new Date();
    t.textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  clock(); setInterval(clock, 20000);
  async function boot() { await reload(); render(); }
  wait(boot);
})();
</script>
</body>
</html>
